      <text x="130" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#7ee787">✓ No Word Limits</text>
      <text x="245" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#7ee787">✓ No Sign-up Required</text>
      <text x="382" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#7ee787">✓ Open Source</text>
