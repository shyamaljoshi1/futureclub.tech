        <rect x="0" y="104" width="165" height="6" rx="3" fill="#8b949e" fill-opacity="0.2" />
        <rect x="0" y="116" width="140" height="6" rx="3" fill="#3fb950" fill-opacity="0.35" />
        <rect x="0" y="128" width="160" height="6" rx="3" fill="#8b949e" fill-opacity="0.2" />
