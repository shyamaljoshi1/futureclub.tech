        <rect x="0" y="104" width="150" height="6" rx="3" fill="#8b949e" fill-opacity="0.2" />
        <rect x="0" y="116" width="170" height="6" rx="3" fill="#f85149" fill-opacity="0.3" />
        <rect x="0" y="128" width="130" height="6" rx="3" fill="#8b949e" fill-opacity="0.2" />
