<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="50%" stop-color="#0f1624"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Glows -->
  <circle cx="220" cy="220" r="280" fill="#ef4444" opacity="0.10" filter="blur(75px)"/>
  <circle cx="980" cy="400" r="320" fill="#10b981" opacity="0.10" filter="blur(80px)"/>

  <!-- Right Visual Diagram: Localhost vs LAN vs Cloud Server -->
  <g transform="translate(640, 100)">
    <!-- Stage 1: Localhost (127.0.0.1) Box -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="480" height="135" rx="12" fill="#161214" stroke="#7f1d1d" stroke-width="1.5"/>
      <rect x="16" y="16" width="34" height="34" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
      <text x="33" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fca5a5" text-anchor="middle">❌</text>
      
      <text x="62" y="32" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#fca5a5">127.0.0.1:3000 (Localhost)</text>
      <text x="62" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#f87171">Loopback trapped in laptop OS. Packets never leave the machine.</text>
      
      <!-- Visual Loopback U-Turn -->
      <g transform="translate(20, 68)">
        <rect x="0" y="0" width="440" height="45" rx="6" fill="#0b0809" stroke="#371214"/>
        <text x="15" y="27" font-family="ui-monospace, monospace" font-size="11" fill="#f87171">Rohan's Laptop</text>
        <path d="M 160 22 C 220 5, 220 40, 160 22" fill="none" stroke="#ef4444" stroke-width="3"/>
        <text x="240" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fca5a5">U-Turn: Packet returns to same OS</text>
      </g>
    </g>

    <!-- Stage 2: LAN Access (0.0.0.0 / 192.168.1.5) Box -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="480" height="135" rx="12" fill="#181510" stroke="#78350f" stroke-width="1.5"/>
      <rect x="16" y="16" width="34" height="34" rx="8" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="33" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fde68a" text-anchor="middle">⚠️</text>

      <text x="62" y="32" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#fde68a">0.0.0.0:3000 (LAN Only)</text>
      <text x="62" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#fbbf24">Wi-Fi friends connect (192.168.1.5). Lid close = process dies.</text>

      <!-- Visual LAN comparison -->
      <g transform="translate(20, 68)">
        <rect x="0" y="0" width="440" height="45" rx="6" fill="#0d0a06" stroke="#451a03"/>
        <text x="15" y="27" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">Same Wi-Fi: OK</text>
        <line x1="130" y1="12" x2="130" y2="34" stroke="#451a03"/>
        <text x="145" y="27" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">Outside Internet: BLOCKED by NAT</text>
      </g>
    </g>

    <!-- Stage 3: True Production Server Box -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="480" height="145" rx="12" fill="#0f1915" stroke="#065f46" stroke-width="1.5"/>
      <rect x="16" y="16" width="34" height="34" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="33" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#a7f3d0" text-anchor="middle">✅</text>

      <text x="62" y="32" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#a7f3d0">Cloud Server / VM (Public IP)</text>
      <text x="62" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#34d399">Public IP 13.233.144.82 • 24/7 Datacenter • Always reachable</text>

      <!-- Architecture formula pill -->
      <g transform="translate(20, 72)">
        <rect x="0" y="0" width="440" height="52" rx="6" fill="#07120e" stroke="#065f46"/>
        <text x="20" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">SERVER = SOFTWARE + HARDWARE</text>
        <text x="20" y="42" font-family="ui-monospace, monospace" font-size="11" fill="#34d399">daemon.listen(port) + 24/7 Datacenter VM (Public IP)</text>
      </g>
    </g>
  </g>

  <!-- Left Content Branding & Titles -->
  <g transform="translate(70, 105)">
    <!-- Series Badge -->
    <g>
      <rect x="0" y="0" width="280" height="34" rx="17" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
      <circle cx="18" cy="17" r="5" fill="#06b6d4"/>
      <text x="32" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="0.5">LOCAL TO PROD</text>
      <rect x="175" y="6" width="95" height="22" rx="11" fill="#27272a"/>
      <text x="222" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f43f5e" text-anchor="middle">EPISODE 01</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
      "Sir... Mere Me To
    </text>
    <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#f43f5e" letter-spacing="-1">
      Chal Rahi Hai..."
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">
      Localhost, 127.0.0.1 vs 0.0.0.0 &amp; What is a Server?
    </text>

    <text x="0" y="250" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Why closing your laptop kills your website, and how public routing actually works.
    </text>

    <!-- Red Interview Stamp Box -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="460" height="85" rx="8" fill="#1c1112" stroke="#dc2626" stroke-width="1.5"/>
      <text x="20" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#ef4444" letter-spacing="1">INTERVIEW ME FASA DIYA • PROBLEM #1</text>
      <text x="20" y="52" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#fca5a5">
        "Website banayi hai? Mere laptop me khol ke dikhao."
      </text>
      <text x="20" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">
        Loopback interface • RFC 1918 Private IP • Hypervisor cliffhanger
      </text>
    </g>

    <!-- Key Takeaway Pill -->
    <g transform="translate(0, 390)">
      <rect x="0" y="0" width="460" height="42" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="20" y="26" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#38bdf8">
        Takeaway: Server = Software (Port) + Hardware (Public IP)
      </text>
    </g>
  </g>
</svg>

