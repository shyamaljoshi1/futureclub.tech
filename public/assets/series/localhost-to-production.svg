<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#06080b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Glows -->
  <circle cx="200" cy="220" r="300" fill="#06b6d4" opacity="0.12" filter="blur(75px)"/>
  <circle cx="1000" cy="400" r="320" fill="#3b82f6" opacity="0.10" filter="blur(80px)"/>

  <!-- Server Rack Graphic on Right Side -->
  <g transform="translate(720, 110)">
    <!-- Datacenter Server Chassis -->
    <rect x="0" y="0" width="400" height="460" rx="14" fill="#0f141e" stroke="#1e293b" stroke-width="2"/>
    <rect x="0" y="0" width="400" height="8" rx="4" fill="url(#cyanGrad)"/>

    <!-- Server Units in Rack -->
    <g transform="translate(20, 30)">
      <!-- Unit 1 -->
      <rect x="0" y="0" width="360" height="70" rx="8" fill="#151b28" stroke="#253047" stroke-width="1.5"/>
      <circle cx="24" cy="35" r="5" fill="#10b981"/>
      <circle cx="40" cy="35" r="5" fill="#06b6d4"/>
      <text x="60" y="32" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#e2e8f0">PROD-WEB-VM-01 [ACTIVE]</text>
      <text x="60" y="50" font-family="ui-monospace, monospace" font-size="11" fill="#06b6d4">PUBLIC IP: 13.233.144.82 : 443</text>
      <rect x="290" y="24" width="55" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="317" y="39" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">ONLINE</text>

      <!-- Unit 2 -->
      <rect x="0" y="85" width="360" height="70" rx="8" fill="#151b28" stroke="#253047" stroke-width="1.5"/>
      <circle cx="24" cy="120" r="5" fill="#10b981"/>
      <circle cx="40" cy="120" r="5" fill="#3b82f6"/>
      <text x="60" y="117" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#e2e8f0">NGINX-REVERSE-PROXY</text>
      <text x="60" y="135" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">SSL Termination • TLS 1.3 Active</text>
      <rect x="290" y="109" width="55" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="317" y="124" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">ONLINE</text>

      <!-- Unit 3 -->
      <rect x="0" y="170" width="360" height="70" rx="8" fill="#151b28" stroke="#253047" stroke-width="1.5"/>
      <circle cx="24" cy="205" r="5" fill="#10b981"/>
      <circle cx="40" cy="205" r="5" fill="#6366f1"/>
      <text x="60" y="202" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#e2e8f0">POSTGRES-DATABASE-REPLICA</text>
      <text x="60" y="220" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">RAID 10 NVMe • Persistent Storage</text>
      <rect x="290" y="194" width="55" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="317" y="209" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">ONLINE</text>

      <!-- Unit 4 (Localhost comparison callout) -->
      <rect x="0" y="255" width="360" height="65" rx="8" fill="#1c1314" stroke="#7f1d1d" stroke-width="1.5"/>
      <circle cx="24" cy="287" r="5" fill="#ef4444"/>
      <text x="60" y="282" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#fca5a5">LOCAL LAPTOP [127.0.0.1:3000]</text>
      <text x="60" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">Loopback trapped • Dies when lid closes</text>
      <rect x="285" y="274" width="60" height="22" rx="4" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
      <text x="315" y="289" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f87171" text-anchor="middle">UNREACH</text>
    </g>

    <!-- Bottom Rack Status -->
    <rect x="20" y="380" width="360" height="55" rx="6" fill="#0a0e17" stroke="#172554" stroke-width="1"/>
    <text x="35" y="405" font-family="ui-monospace, monospace" font-size="11" fill="#38bdf8">99.99% UPTIME • DUAL REDUNDANT PSU</text>
    <text x="35" y="422" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">Datacenter Tier-3 • 10 Gbps BGP Uplink</text>
  </g>

  <!-- Content Centered / Left -->
  <g transform="translate(80, 130)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="290" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#06b6d4"/>
    <text x="36" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">ORIGINAL DEVOPS &amp; ARCHITECTURE</text>

    <!-- Huge Series Title -->
    <text x="0" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      Localhost
    </text>
    <text x="0" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="url(#cyanGrad)" letter-spacing="-1.5">
      to Production
    </text>

    <!-- Subtitle -->
    <text x="0" y="245" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#e2e8f0">
      Ek Website, 30 Problems: The Engineering Journey
    </text>
    <text x="0" y="280" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      From 127.0.0.1 traps to VMs, Reverse Proxies, SSL, Load Balancers &amp; Cloud scale.
    </text>

    <!-- Badges -->
    <g transform="translate(0, 325)">
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="82" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">30 Core Episodes</text>

      <rect x="180" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="255" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Real Interviews</text>

      <rect x="345" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="420" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">Cloud &amp; DevOps</text>
    </g>
  </g>
</svg>

