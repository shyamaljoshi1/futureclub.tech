<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#14121e"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="redisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Phosphor Glows -->
  <circle cx="200" cy="220" r="260" fill="#f59e0b" opacity="0.10" filter="blur(75px)"/>
  <circle cx="950" cy="380" r="300" fill="#dc2626" opacity="0.12" filter="blur(80px)"/>

  <!-- Left Side: Editorial Typography & Problem Formulation -->
  <g transform="translate(60, 75)">
    <!-- Series Tag Pill -->
    <rect x="0" y="0" width="240" height="32" rx="16" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="16" r="4.5" fill="#f59e0b"/>
    <text x="28" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" letter-spacing="1">2 MINUTE ME SAMJO • EP 2</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Race Condition
    </text>
    <text x="0" y="135" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#fbbf24" letter-spacing="-0.5">
      in Ticket Booking Apps
    </text>

    <!-- Problem Hook Callout -->
    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="480" height="88" rx="10" fill="#18151b" stroke="#372c3d" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="88" rx="2" fill="#ef4444"/>
      <text x="20" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fca5a5">THE DOUBLE BOOKING TRAP:</text>
      <text x="20" y="52" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">Ramayan ka last ticket: Tum aur ek anjaan insaan</text>
      <text x="20" y="72" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">dono ek hi second me tap karein, toh kya hoga?</text>
    </g>

    <!-- Core Mechanism Pills -->
    <g transform="translate(0, 275)">
      <text x="0" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SYSTEM DESIGN ARSENAL:</text>

      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="220" height="42" rx="6" fill="#131722" stroke="#232d42" stroke-width="1"/>
        <text x="14" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60a5fa">3-STATE SEAT LIFECYCLE</text>
        <text x="14" y="32" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Available → Held → Booked</text>
      </g>

      <g transform="translate(235, 28)">
        <rect x="0" y="0" width="235" height="42" rx="6" fill="#1f1418" stroke="#3d1d28" stroke-width="1"/>
        <text x="14" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171">ATOMIC REDIS LOCK (SETNX)</text>
        <text x="14" y="32" font-family="ui-monospace, monospace" font-size="10" fill="#fca5a5">Single Referee • Microsecond TTL</text>
      </g>
    </g>

    <!-- Author Badge -->
    <g transform="translate(0, 385)">
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">thefutureguyy.ai</text>
      <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Engineering First Principles Explained</text>
    </g>
  </g>

  <!-- Right Side Visual Diagram: High-Concurrency Lock Race -->
  <g transform="translate(580, 60)">
    <!-- Container Card -->
    <rect x="0" y="0" width="560" height="550" rx="16" fill="#0c1017" stroke="#1f2937" stroke-width="1.5"/>

    <!-- Diagram Header -->
    <g transform="translate(24, 22)">
      <rect width="512" height="34" rx="8" fill="#030712" stroke="#1f2937" stroke-width="1"/>
      <circle cx="16" cy="17" r="4.5" fill="#ef4444" opacity="0.8"/>
      <circle cx="30" cy="17" r="4.5" fill="#f59e0b" opacity="0.8"/>
      <circle cx="44" cy="17" r="4.5" fill="#10b981" opacity="0.8"/>
      <text x="65" y="21" font-family="ui-monospace, monospace" font-size="11" fill="#9ca3af">bookmyshow-concurrency-engine // race-condition-resolver</text>
    </g>

    <!-- Two Competing Users at T=0ms -->
    <g transform="translate(24, 75)">
      <!-- User A (Rohan) -->
      <g transform="translate(0, 0)">
        <rect width="245" height="110" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1.5"/>
        <text x="14" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">User 1 (Tum)</text>
        <text x="14" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#6ee7b7">POST /book/seat-J12</text>
        <text x="14" y="60" font-family="ui-monospace, monospace" font-size="9" fill="#a7f3d0">Timestamp: 10:00:00.001ms</text>
        <rect x="14" y="74" width="130" height="22" rx="4" fill="#022c22"/>
        <text x="79" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#34d399">LOCK ACQUIRED ⏱</text>
      </g>

      <!-- User B (Anjaan Insaan) -->
      <g transform="translate(267, 0)">
        <rect width="245" height="110" rx="10" fill="#3f1115" stroke="#dc2626" stroke-width="1.5"/>
        <text x="14" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fca5a5">User 2 (Anjaan Insaan)</text>
        <text x="14" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#f87171">POST /book/seat-J12</text>
        <text x="14" y="60" font-family="ui-monospace, monospace" font-size="9" fill="#fca5a5">Timestamp: 10:00:00.002ms</text>
        <rect x="14" y="74" width="140" height="22" rx="4" fill="#1f0709"/>
        <text x="84" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#f87171">409: SEAT IS HELD ❌</text>
      </g>
    </g>

    <!-- Center Redis Referee Component -->
    <g transform="translate(24, 205)">
      <rect width="512" height="120" rx="10" fill="#180c10" stroke="#7f1d1d" stroke-width="1.5"/>
      <rect x="0" y="0" width="512" height="3" fill="#ef4444"/>

      <!-- Redis Badge -->
      <g transform="translate(16, 16)">
        <rect width="160" height="24" rx="4" fill="#991b1b"/>
        <text x="80" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">REDIS SINGLE REFEREE</text>
      </g>

      <text x="190" y="32" font-family="ui-monospace, monospace" font-size="10" fill="#f87171">Single-Threaded Event Loop</text>

      <!-- Atomic Command Box -->
      <g transform="translate(16, 50)">
        <rect width="480" height="54" rx="6" fill="#0a0507" stroke="#3f121b" stroke-width="1"/>
        <text x="14" y="22" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#fbbf24">SET seat:ramayan:J12 "user1" NX EX 480</text>
        <text x="14" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#9ca3af">NX = Only set if key does not exist • EX 480 = 8 min TTL lease</text>
      </g>
    </g>

    <!-- Bottom FSM State Flow -->
    <g transform="translate(24, 345)">
      <rect width="512" height="175" rx="10" fill="#0a0e17" stroke="#1f2937" stroke-width="1"/>
      <text x="16" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" letter-spacing="0.5">3-STATE SEAT LIFECYCLE (FINITE STATE MACHINE)</text>

      <!-- State 1: Available -->
      <g transform="translate(16, 38)">
        <rect width="140" height="80" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
        <circle cx="20" cy="20" r="4" fill="#3b82f6"/>
        <text x="32" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#e5e7eb">1. AVAILABLE</text>
        <text x="14" y="45" font-family="system-ui, sans-serif" font-size="9" fill="#9ca3af">Seat is green on map.</text>
        <text x="14" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#9ca3af">Anyone can tap.</text>
      </g>

      <!-- Arrow 1 -->
      <path d="M 160 78 L 180 78" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>

      <!-- State 2: Held -->
      <g transform="translate(186, 38)">
        <rect width="140" height="80" rx="6" fill="#2d1c07" stroke="#b45309" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="4" fill="#f59e0b"/>
        <text x="32" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">2. HELD (LOCKED)</text>
        <text x="14" y="45" font-family="system-ui, sans-serif" font-size="9" fill="#fde68a">Temporary 8-min lease.</text>
        <text x="14" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#fde68a">Other users blocked.</text>
      </g>

      <!-- Arrow 2 -->
      <path d="M 330 78 L 350 78" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

      <!-- State 3: Booked -->
      <g transform="translate(356, 38)">
        <rect width="140" height="80" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
        <circle cx="20" cy="20" r="4" fill="#10b981"/>
        <text x="32" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">3. BOOKED</text>
        <text x="14" y="45" font-family="system-ui, sans-serif" font-size="9" fill="#a7f3d0">Payment verified.</text>
        <text x="14" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#a7f3d0">Permanent in PostgreSQL.</text>
      </g>

      <!-- Fallback Return Arrow -->
      <g transform="translate(186, 126)">
        <text x="70" y="18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#f87171">Payment Fail / Timeout → Lock Expired → Back to AVAILABLE</text>
      </g>
    </g>
  </g>
</svg>

