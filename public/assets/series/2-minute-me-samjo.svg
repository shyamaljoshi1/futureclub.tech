<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Glows -->
  <circle cx="250" cy="250" r="320" fill="#f43f5e" opacity="0.12" filter="blur(70px)"/>
  <circle cx="950" cy="450" r="300" fill="#3b82f6" opacity="0.1" filter="blur(70px)"/>

  <!-- Content Centered / Left -->
  <g transform="translate(100, 150)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="260" height="36" rx="18" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#f43f5e"/>
    <text x="36" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f43f5e" letter-spacing="1">ORIGINAL VIDEO SERIES</text>

    <!-- Huge Series Title -->
    <text x="0" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      2 Minute
    </text>
    <text x="0" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="-1.5">
      me samjo
    </text>

    <!-- Subtitle -->
    <text x="0" y="245" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">
      Complex AI Breakthroughs &amp; Deep Tech Demystified in 120 Seconds.
    </text>
    <text x="0" y="280" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#64748b">
      Zero fluff • Deep mechanical insights • Video reel + in-depth blog breakdown
    </text>

    <!-- Badges -->
    <g transform="translate(0, 325)">
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="80" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Episode 01 Live</text>

      <rect x="175" y="0" width="220" height="34" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="285" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a1a1aa" text-anchor="middle">Curated by @thefutureguyy.ai</text>
    </g>
  </g>
</svg>

