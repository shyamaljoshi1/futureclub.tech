<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#2d150b" />
      <stop offset="60%" stop-color="#140a05" />
      <stop offset="100%" stop-color="#070302" />
    </radialGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid mesh -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glows -->
  <circle cx="280" cy="240" r="220" fill="#f97316" opacity="0.16" filter="blur(80px)" />
  <circle cx="920" cy="380" r="200" fill="#fbbf24" opacity="0.10" filter="blur(70px)" />

  <!-- Top bar -->
  <g transform="translate(80, 70)">
    <rect width="180" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
    <circle cx="18" cy="17" r="5" fill="#f97316" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">@thefutureguyy.ai</text>
  </g>

  <g transform="translate(1120, 70)">
    <text x="0" y="22" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f97316" letter-spacing="1.5">BREAKING AI NEWS</text>
  </g>

  <!-- Central Graphic: 3D Wireframe Cube & Spatial Rays -->
  <g transform="translate(740, 160)">
    <!-- 3D Spatial Box Graphic -->
    <polygon points="180,60 280,110 280,240 180,190" fill="#ea580c" fill-opacity="0.25" stroke="#f97316" stroke-width="2" />
    <polygon points="80,110 180,60 180,190 80,240" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="2" />
    <polygon points="80,110 180,60 280,110 180,160" fill="#fb923c" fill-opacity="0.35" stroke="#fed7aa" stroke-width="2" />
    
    <!-- Rotating coordinate ring -->
    <ellipse cx="180" cy="160" rx="170" ry="60" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />
    <circle cx="340" cy="140" r="6" fill="#fbbf24" />
    <circle cx="20" cy="180" r="5" fill="#f97316" />
    <text x="180" y="320" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#fdba74">SPATIAL REASONING · 3D MODELING</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(80, 200)">
    <rect width="160" height="28" rx="6" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-opacity="0.4" />
    <text x="80" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fb923c" letter-spacing="1">ANTHROPIC</text>

    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Claude Fable 5.2
    </text>

    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="url(#coralGrad)" letter-spacing="-0.5">
      &amp; Claude Mythos 5.2 Launched
    </text>

    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" width="550">
      Engineered for daunting 3D modeling, visual reasoning &amp; agentic computer use.
    </text>

    <g transform="translate(0, 240)">
      <rect width="180" height="42" rx="8" fill="#1e130c" stroke="#f97316" stroke-width="1.2" />
      <text x="90" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fdba74">Frontier AI Release</text>
      
      <rect x="200" y="0" width="160" height="42" rx="8" fill="#1e130c" stroke="#451a03" stroke-width="1" />
      <text x="280" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Nov 11, 2026</text>
    </g>
  </g>
</svg>

